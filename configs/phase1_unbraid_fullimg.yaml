# Phase 1 (full-image) — Unbraid pretraining for BLD
#
# Same as phase1_unbraid.yaml, but trains on FULL images (background as input
# context) with a PURE masked loss (outside=0). The model learns hair generation
# while attending to real surroundings from the very start, so the later BLD
# inference is in-distribution. Background output is never used (BLD overwrites
# it), so it is not supervised.
#
# Run (GPU server):
#   python scripts/train.py --config configs/phase1_unbraid_fullimg.yaml

base: configs/base.yaml

training:
  phase: pretrain
  dataset: unbraid
  full_image_target: true

  epochs: 40
  batch_size: 2
  gradient_accumulation_steps: 4   # effective batch 8
  learning_rate: 1.0e-4
  warmup_steps: 500

  loss_weights:
    flow: 1.0
    outside: 0.0              # TRUE masked loss — hair region only
    lpips: 0.1
    lpips_warmup_frac: 0.3    # activate LPIPS after 30% of steps
    edge: 0.0                 # no edge loss in phase 1

checkpointing:
  output_dir: checkpoints/phase1_unbraid_fullimg/
  eval_every: 10
  save_every: 20
